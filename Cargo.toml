[package]
name = "agy-gyro"
version = "0.1.0"
edition = "2021"
description = "Gemini API retry proxy with exponential backoff for Antigravity CLI"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
http = "1.2"
http-body-util = "0.1"
bytes = "1.10"
futures-util = "0.3"
httpdate = "1.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
wiremock = "0.6"
